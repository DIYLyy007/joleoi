[custom]
; ========================================================================
; 0、最高优先级防泄露规则 (拦截 WebRTC 真实 IP 泄露、STUN 探针与 IPv6 逃逸)
; ========================================================================
custom_rule=DOMAIN-KEYWORD,stun.,REJECT
custom_rule=DOMAIN-KEYWORD,stun,REJECT
custom_rule=DOMAIN-SUFFIX,stun.qq.com,REJECT
custom_rule=DOMAIN-SUFFIX,stun.miwifi.com,REJECT
custom_rule=DOMAIN-SUFFIX,stun.hitv.com,REJECT
custom_rule=DOMAIN-SUFFIX,stun.chat.bilibili.com,REJECT
custom_rule=DOMAIN-SUFFIX,stunprotocol.org,REJECT
custom_rule=DOMAIN-SUFFIX,global.stun.twilio.com,REJECT
custom_rule=DST-PORT,3478-3479,REJECT
custom_rule=DST-PORT,5349-5350,REJECT
custom_rule=DST-PORT,19302-19309,REJECT
custom_rule=IP-CIDR6,2000::/3,REJECT,no-resolve
custom_rule=DOMAIN-SUFFIX,events.data.microsoft.com,REJECT

